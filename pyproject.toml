[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msu-llm-lab"
version = "0.1.0"
description = "Internal research workbench for MSU admissions LLM evaluation and optimization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MSU Research Team" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
msu-llm-lab = "msu_llm_lab.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/msu_llm_lab"]
